# Treeship security and cryptography claims registry.
#
# SOURCE OF TRUTH for what Treeship's docs are allowed to claim about
# security-sensitive properties: the keystore, transparency/anchoring, ZK
# proofs, and what a signed receipt does and does not prove. Every claim
# about one of these areas gets an id, a status, and a proof link, so a
# claim can be checked against the code instead of trusted by tone.
#
# A linter at scripts/check-claims.py validates:
#   - every `proof` path exists on disk (or is a bare git ref like a PR/issue
#     for a claim with no single code location)
#   - a fixed, small set of security-sensitive doc files (`scanned_files`
#     below) contain none of the banned phrases, UNLESS the phrase appears
#     only to explicitly disclaim it -- and "disclaim" is judged per claim,
#     not per phrase: a claim's `not:` list names the banned phrases ITS OWN
#     `says` field negates ("not machine-bound"), and a doc line that claim
#     backs must negate that word too, not bare-assert it (N-31: a claim
#     whose `says` field affirms a word instead, with its own qualifier --
#     rekor-artifact-anchoring's "witnessed only if ..." -- doesn't require
#     negation from the doc line either; the check derives which is which
#     from `says`, not from a separate flag)
#   - SECURITY.md's supported-versions table names the current CHANGELOG minor
#
# Status taxonomy:
#   shipped    the claim describes what ships today; proof is a code path
#   next       implemented but not in the latest tagged release
#   designed   a documented direction, not implemented (design sketch)
#   retired    a claim that used to be true and no longer is (kept for history)
#
# Banned phrases (require a claims.yml id backing any use): passphrase,
# machine-bound, tamper-proof, immutable, anchored, witnessed, air-gapped.
# These are banned only within `scanned_files` below -- unrelated, accurate
# uses elsewhere (an HTTP Cache-Control: immutable header, a workflow spec's
# actually-immutable declared graph) are not security claims about the
# keystore or the verifier and are out of scope for this registry.

scanned_files:
  - SECURITY.md
  - AGENTS.md
  - docs/security/threat-model.md
  - docs/content/docs/concepts/security.mdx
  - docs/content/docs/concepts/trust-model.mdx
  - docs/content/docs/cli/init.mdx
  - docs/content/docs/concepts/zero-knowledge.mdx
  - docs/content/docs/concepts/room-sessions.mdx
  - docs/content/docs/commerce/compliance.mdx
  - packages/core-wasm/README.md
  - packages/zk-circom/README.md

claims:
  - id: keystore-at-rest
    status: shipped
    says: >
      AES-256-GCM encrypted keystore, under a key derived from a secret
      32-byte seed file (machine_seed) stored alongside the keystore.
      A non-secret machine identifier is mixed in only as a binding salt,
      not as the primary key. There is no passphrase; nothing the user
      types or remembers protects the keystore.
    proof: packages/core/src/keys/mod.rs
    not: ["passphrase", "machine-bound"]
    notes: >
      Copying .treeship/ (keys + machine_seed) is sufficient to decrypt and
      sign elsewhere. Losing machine_seed makes the keystore unrecoverable.
      The machine-id salt (hostname / /etc/machine-id) is a decrypt-only
      migration fallback for pre-AUD-19 keystores, never the primary key.

  - id: keystore-cipher-history
    status: retired
    says: >
      Prior to v0.10.3, the keystore was documented as AES-256-GCM but
      actually shipped a broken SHA-256-CTR + HMAC construction
      (TS-2026-001). That specific historical claim is quoted, not
      repeated, in the advisory record.
    proof: docs/security/TS-2026-001.md
    not: []
    notes: "Historical incident record only -- not a claim about the current build."

  - id: rekor-artifact-anchoring
    status: shipped
    says: >
      Per-artifact anchoring: a pushed artifact gets a dsse entry in
      Sigstore's public transparency log. `verify` counts an anchor as
      witnessed only if the stapled entry verifies offline (signed entry
      timestamp, RFC 6962 inclusion proof, signed checkpoint) against a
      trusted log key -- the built-in Sigstore key, or an operator-pinned
      `transparency_log` root.
    proof: packages/core/src/verify/rekor.rs
    not: ["anchored", "witnessed"]
    notes: >
      Opt-in and coverage-dependent: only pushed artifacts are covered, an
      agent-key-only artifact is skipped, and it can be disabled. Anchors
      recorded before this shipped carry no proof and report as claimed but
      unverified.

  - id: checkpoint-not-witnessed
    status: shipped
    says: >
      A Hub Merkle checkpoint is signed only by the publisher's own key.
      The hub verifies checkpoint signatures but never signs or
      countersigns one itself, and discards any caller-supplied Rekor
      index rather than serving it back. A checkpoint alone is not an
      externally witnessed record -- it is the publisher's own signed
      assertion, one level up from an individual artifact's signature.
    proof: packages/hub/internal/merkle/handlers.go
    not: ["anchored", "witnessed"]
    notes: "Distinct from rekor-artifact-anchoring, which is a real external witness for individual pushed artifacts."

  - id: checkpoint-root-anchoring
    status: designed
    says: >
      Anchoring a room or workspace's checkpoint root itself (not just
      individual pushed artifacts) to an external log, RFC 3161, or
      OpenTimestamps is a documented design direction, not implemented.
    proof: docs/feature-inventory.yml
    not: ["anchored", "witnessed"]

  - id: checkpoint-timestamp-is-claimed
    status: shipped
    says: >
      A Merkle checkpoint's `signed_at` is the publisher's own claim, not
      an independently recorded time: `GET /v1/merkle/checkpoint/latest`
      computes `age_seconds` from the checkpoint's own `signed_at` against
      the current time, because the hub stores and serves the checkpoint
      verbatim and keeps no separate received-at time to check it against.
      "This artifact is in the checkpoint's tree" (a real, Merkle-provable
      membership claim) and "the checkpoint was published at time T" (an
      unwitnessed assertion by whoever holds the signing key) are two
      different claims, and only the first is independently checkable from
      a bare checkpoint. The part that is independently timestamped is
      per-artifact Rekor anchoring, which covers specific pushed artifacts,
      not a checkpoint's root or tree as a whole.
    proof: packages/hub/internal/merkle/handlers.go
    not: ["anchored", "witnessed"]
    notes: >
      Same underlying fact as checkpoint-not-witnessed (a checkpoint is
      self-signed, nothing countersigns it); registered as its own entry
      because the final 0.31.12 external docs re-test (D11) found two
      pages independently overclaiming a general "checkpoints prevent
      backdating" guarantee that doesn't hold without per-artifact Rekor
      anchoring, which is coverage-dependent and doesn't anchor the root.

  - id: use-action-binding
    status: shipped
    says: >
      Consuming an approval grant reserves an Approval Use record before
      the action is signed, then signs the action, then backfills the
      use record's `action_artifact_id` with the signed action's id as a
      sidecar write that does not change the use record's own
      digest-stable bytes. A verifier given a specific action matches it
      to the use record naming it. A use record with no name on it --
      the backfill never completed (a crash between signing and the
      backfill write), or it predates this field -- falls back to
      matching the grant's most recent use instead of the action's own
      identity, which is a weaker claim: recency is not the same thing
      as "this specific action consumed this specific use."
    proof: packages/core/src/journal/mod.rs
    not: []
    notes: >
      find_use_for_action's own comment documents the fallback
      ("Records without an action id ... fall back to the most recent
      match, as before") and the bug it exists to avoid re-introducing
      (a second journal directory's unrelated `use 1/1` vouching for an
      action it never recorded). Final 0.31.12 external docs re-test
      (D12) found approval-authority.mdx describing the backfill step
      without noting it can be absent or what happens when it is.

  - id: identity-verification-not-implemented
    status: designed
    says: >
      Domain-ownership, voice-fingerprint and tool-manifest verification
      for published agent identities (a DNS TXT challenge, a style
      fingerprint, a manifest probe, each served from hub routes like
      `/identity/{slug}/verify-domain`) are not implemented: the hub has
      no `/v1/identity*` routes or equivalent at all. A bare agent
      certificate proves an Ed25519 signature; stronger third-party
      verification signals beyond that are a documented design
      direction, not a shipped feature.
    proof: packages/hub/main.go
    not: []
    notes: >
      Final 0.31.12 external docs re-test (D1) found
      concepts/agent-identity.mdx describing this as a working "Trust
      amplifiers" feature set. Verified by grep: no route in
      packages/hub/main.go matches identity, verify-domain, verify-voice,
      verify-tools or voice-fingerprint.

  - id: hook-cannot-block
    status: shipped
    says: >
      The installed shell hooks (`treeship install`'s zsh `preexec`,
      bash `DEBUG` trap, fish `fish_preexec`) call `treeship hook pre`
      before a matched command runs, but none of the three act on its
      exit code to stop that command -- zsh preexec and fish
      `fish_preexec` are informational hooks with no cancel mechanism,
      and the bash snippet doesn't enable `extdebug`, the one bash
      mechanism that lets a DEBUG trap's exit status skip the next
      command. `hook pre` exiting 1 on an unapproved `require_approval`
      match is a signal written to a pending-state file for the local
      approval workflow and `hook post`, not an enforcement point: the
      hook records what it saw, it does not gate what runs.
    proof: packages/cli/src/commands/install.rs
    not: []
    notes: >
      Final 0.31.12 external docs re-test (D3) found cli/hook.mdx
      saying exit 1 is "surfaced as a blocked command" by "most shells",
      without noting that none of the three installed hook mechanisms
      act on that exit code to prevent the command from running.

  - id: zk-groth16-quarantined
    status: retired
    says: >
      The Circom/Groth16 proving path (policy-checker, input-output-binding,
      prompt-template circuits) is quarantined: its proving keys were
      generated locally with no real multi-party ceremony, making the
      circuits forgeable by construction. `prove`/`verify-proof` fail
      closed. The published `@treeship/core-wasm` build does not enable
      the `zk` feature, so there is no browser-side Groth16 check today.
    proof: packages/zk-circom/README.md
    not: ["air-gapped"]
    notes: "The circuits are retained as design references for the statement-first rebuild (RISC Zero), not as a sound proving path."

  - id: hub-cannot-forge-signed-verification
    status: shipped
    says: >
      "The Hub cannot forge a passing result" is true for a specific,
      narrow thing: verifying a named artifact (a signed DSSE envelope,
      by artifact id) with the CLI or `@treeship/verify`'s WASM verifier
      against the caller's own pinned trust roots. The Hub holds no
      signing key, so it cannot produce a signature that verifies
      against a root it doesn't control, and `/v1/verify/:id`'s
      server-side verdict is retired for exactly this reason (a server's
      verdict is the server's trust policy, not yours).

      It is NOT true for a bare Session Receipt fetched from `GET
      /v1/receipt/{session_id}` or `verifyReceipt()`/`--structural`
      `package verify`: the receipt's `determinism` and `merkle_root`
      checks are self-consistency only (does the JSON round-trip; does
      the stated Merkle root match the artifact ids in it), not a
      signature check, and cover only the artifact ids -- the timeline,
      side_effects, tool_usage and narrative are unsigned and untouched
      by either check. Anyone who can write the stored bytes (the Hub, a
      compromised database, a MITM before TLS) can fabricate a
      receipt.json from scratch with correct internal hashes and pass
      both checks; nothing here would catch it. The only check that
      reaches a real, actor-signed anchor is `package-verify-binds-
      receipt`'s `receipt_binding` row, which needs the session's
      `record.json` -- not present in a bare fetched receipt.json, only
      in a full `.treeship` package.
    proof: packages/core/src/session/package.rs
    not: []
    notes: >
      packages/core/src/session/package.rs's own comment on the
      determinism check states the failure mode directly: "An attacker
      who edits those fields and re-serializes will pass determinism
      and pass the Merkle check." N-30 (final 0.31.11 re-test) found
      the unscoped claim, unqualified, in api/overview.mdx, api/verify.mdx,
      api/receipt-get.mdx, concepts/trust-model.mdx and AGENTS.md.

  - id: replay-posture-rows
    status: shipped
    says: >
      `package verify` reports replay protection for a consumed approval
      grant as one of three rows, in increasing scope:
      `replay-package-local` (duplicate uses inside this one package),
      `replay-local-journal` (the producer machine's own append-only
      Approval Use Journal, not present in a package verified elsewhere),
      and `replay-hub-org` (an embedded, self-signed hub-org checkpoint
      naming this grant's uses, when one happens to be in the package).
      The third row's name names a trust *kind* the client can verify a
      checkpoint against, not a Hub *service*: nothing in the Hub mints,
      serves or enforces hub-org checkpoints today, so a package with no
      embedded one reports `hub-org not checked`, not a failure -- there
      is no live, central replay enforcement to report on.
    proof: packages/core/src/session/package.rs
    not: []
    notes: >
      Real row names confirmed by grep (`replay-package-local`,
      `replay-local-journal`, `replay-hub-org`); no hub-org route exists
      in packages/hub/main.go or packages/hub/internal/. Final 0.31.12
      external docs re-test (D2) found capabilities.mdx inventing a
      fourth, non-existent posture name ("hub-verified") and
      trust-model.mdx describing hub_org as "this hub's org-wide
      single-use approval checkpoints" as though the Hub produces and
      enforces them.

  - id: package-verify-binds-receipt
    status: shipped
    says: >
      `session close` signs a `session.v1` close record over the SHA-256
      digest of the just-built `receipt.json` and the session's own id;
      the package carries that record as `record.json`. `package verify`'s
      `receipt_binding` check re-verifies the record's signature, confirms
      it names this session, and recomputes `receipt.json`'s digest to
      confirm it matches what was signed at close -- so the sealed
      artifact set cannot be edited or rewritten after close without that
      row failing, even when every per-artifact signature still verifies
      on its own. Whether that signing key is one this reader has decided
      to trust is a separate question, answered by the `signer_trust` row:
      it passes only when the key is a pinned trust root (matched by the
      key's own bytes, not by a key-id string) or one of this ship's own
      keys.
    proof: packages/core/src/session/package.rs
    not: []
    notes: >
      A package built before 0.31.4, or a 0.31.2/0.31.3 package (which
      wrote artifact envelopes but no record.json), has nothing for this
      row to check: WARN when the package carries no envelopes at all, or
      under --structural; FAIL otherwise, since the record's absence
      cannot be told apart from a removed record.json without a signed
      statement either way (W1-4, CLI-4).

  - id: transparency-log-client-reverified
    status: shipped
    says: >
      The Hub's agent transparency log serves metadata plus Merkle
      inclusion proofs only, never payloads. Every reader-side surface
      that uses it -- `treeship audit`, `history`, `resolve --hub` --
      re-verifies each anchored entry's Merkle inclusion offline against
      the reader's own trust roots rather than trusting the Hub's say-so,
      and `audit` additionally witnesses: it persists the highest
      *verified* checkpoint it has seen per (hub, signer) locally and
      compares each new one against it, warning on a forking or
      regressing hub. This is the client half of Certificate Transparency
      for agents -- the Hub serves, the client decides -- distinct from
      rekor-artifact-anchoring (an external, third-party Sigstore log) and
      from checkpoint-not-witnessed (whether a checkpoint is
      externally corroborated at all, which this client-side witnessing
      is not: it catches a hub contradicting itself, not a hub colluding
      consistently with a forger).
    proof: docs/specs/transparency-log.md
    not: ["anchored", "witnessed"]
    notes: >
      Verified against `audit --help`, `history --help`, `resolve --hub
      --help` and the spec's own slice list (2026-09-25 full audit,
      area C: 4 of 6 specs marked draft-not-implemented were found
      substantially shipped, this one among them).

  - id: hub-storage-write-once
    status: shipped
    says: >
      The Hub's own storage is write-once and edit-free, not immutable:
      a pushed artifact is inserted `ON CONFLICT(artifact_id) DO NOTHING`
      (content-addressed, so a re-push of the same bytes is a no-op,
      never an overwrite), and a session's receipt can be filled exactly
      once -- a second upload for the same session_id is refused with
      409, not replaced. Nothing the Hub's API exposes can silently
      change a stored artifact or receipt in place. But the publishing
      dock can withdraw its own session receipt: `DELETE
      /v1/receipt/{session_id}` (`treeship hub unpublish`) clears the
      receipt body, name, timing and counts and sets the row to
      `status = 'tombstoned'` permanently -- the hub answers `410 Gone`
      from then on and the session id can never be refilled or
      re-published. A tombstone is not a silent edit: it is a one-shot,
      publisher-only, publicly-visible withdrawal, distinct from an
      overwrite or an in-place edit. This is a property of the Hub's
      database constraints, distinct from receipt-tamper-evidence (which
      holds even with no Hub involved at all): a Hub operator with direct
      database access could still edit a row, but the Hub's own API never
      offers a path to silently overwrite -- or un-tombstone -- what it
      already stored.
    proof: packages/hub/internal/receipts/receipts.go
    not: ["immutable"]
    notes: >
      Content-addressing (packages/hub/internal/db/db.go's `ON
      CONFLICT(artifact_id) DO NOTHING`) covers artifacts; receipts are
      write-once per session_id via InsertSessionWriteOnce. The tombstone
      path is `db.TombstoneSession` (same file): publisher-owned check,
      `WHERE tombstoned_at IS NULL` makes it one-shot, and the UPDATE
      clears the receipt fields rather than deleting the row, so a later
      PUT for the same session_id still finds a row and is refused
      (#533, shipped 0.31.11).

  - id: receipt-tamper-evidence
    status: shipped
    says: >
      A signed artifact is tamper-evident, not tamper-proof or immutable:
      editing the signed payload changes the content-addressed artifact id
      and breaks the signature. Fields outside the signed payload can
      still change, and the key holder can always sign a new artifact.
      An approver URI in a signed approval records who was named as
      approving, not cryptographic proof that a specific human approved,
      unless that approver signs with their own separately pinned key.
    proof: packages/core/src/attestation/id.rs
    not: ["tamper-proof", "immutable"]

status_check:
  file: SECURITY.md
  # SECURITY.md's Supported versions table must name this minor (matched
  # loosely: "0.<minor>.x" against CHANGELOG.md's latest `## <version>` line).
  match: "supported-versions-minor"
