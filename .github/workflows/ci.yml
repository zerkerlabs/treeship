name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # PR-level guard against the failure mode that produced the v0.9.6 PyPI
  # drift: pyproject.toml at 0.9.5 while every other package was at 0.9.6,
  # and stale @treeship/core-wasm pins in three packages. Anchors on
  # packages/core/Cargo.toml and fails if any other site disagrees.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check internal version consistency
        run: python3 scripts/check-release-versions.py --consistency

  # Static check that every page advertised in a docs `meta.json`
  # resolves to a real `.mdx` file (or a sub-section), every section
  # root has either an index.mdx or a redirect in `next.config.mjs`,
  # and every redirect points at a destination that exists. Catches
  # the failure mode where a renamed/deleted doc leaves a sidebar
  # entry pointing at a 404, or where a new section ships without a
  # root redirect so `/cli` works but `/concepts` doesn't. Cheap; no
  # network, no build.
  docs-route-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check docs route health
        run: python3 scripts/check-docs-routes.py

  # Docs-to-code drift gates (the 2026-07 audit failure modes). All static,
  # no build: the OpenAPI spec must match the hub router's route table, docs
  # may only reference SDK methods/exports that exist in the TypeScript
  # sources, every entry in feature-inventory.yml must point at real code,
  # and every spec file must be indexed with an honest status.
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pyyaml (feature-inventory linter)
        run: pip install pyyaml
      - name: Hub OpenAPI matches the router
        run: python3 scripts/check-hub-openapi.py
      - name: Docs reference only real SDK methods
        run: python3 scripts/check-sdk-docs.py
      - name: Feature inventory entries point at real code
        run: python3 scripts/check-feature-inventory.py --strict

      # The mechanical half of the capability index. feature-inventory.yml is
      # curated (what we ship and how stable); this is derived (what is
      # actually reachable, to the byte). A new route or wire type fails here
      # until the map is regenerated, so the surface cannot grow in silence.
      - name: Capability map matches source
        run: |
          cargo build --bin treeship --quiet
          python3 scripts/gen-capability-map.py --check
      - name: Every protocol spec is indexed
        run: python3 scripts/check-specs-index.py
      - name: Published crates embed only files inside their own root
        run: python3 scripts/check-vendored-fonts.py
      - name: Paper-receipt template matches the copy vendored downstream
        run: python3 scripts/check-downstream-template.py
      - name: Generated feature matrix matches the inventory
        # The generator needs only the `yaml` package (package-lock.json is
        # gitignored in docs/, so no npm ci; skip the full fumadocs install).
        run: |
          cd docs
          npm install --no-save --ignore-scripts --no-audit --no-fund yaml@^2.9.0
          node scripts/sync-feature-matrix.mjs --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)

      # Run the full shipped-binary test surface, not just core. Before this,
      # CI ran only `cargo test -p treeship-core`, so every regression test in
      # treeship-cli (capability / verify / hub / wrap / resolve / profile) and
      # treeship-core-wasm (the browser verifier) passed on a contributor's
      # machine but never gated a merge. That is the gap the 2026-07 audits
      # flagged: a fix's fail-before-fix test must actually run on push.
      # (treeship-zk-risc0 needs the RISC0 guest toolchain and is added
      # separately; the `zk` feature is pre-release.)
      - name: Run tests
        run: cargo test -p treeship-core -p treeship-cli -p treeship-core-wasm

      - name: The published crate tarball actually compiles
        # `cargo publish` builds from a tarball containing only files under the
        # crate root, so an include reaching outside it compiles here and fails
        # there. That is how treeship-core missed crates.io in v0.22.0 while
        # npm and PyPI shipped -- a partial release the version preflight could
        # not catch, because every version was correct. This runs the same
        # verify step publish does.
        run: cargo package -p treeship-core --allow-dirty

      - name: Build CLI
        run: cargo build -p treeship-cli

      # The two gates that need the binary. The command matrix docs page is
      # generated from the CLI's own help output — a surface change without a
      # regen fails here. The snippets script executes the flows the README
      # and docs teach (wrap/verify, scoped approvals, onboard → key-bound,
      # selective disclosure, structural-pass semantics) and asserts the
      # documented verdicts, offline, in a throwaway store.
      - name: Generated CLI command matrix matches the binary
        run: python3 scripts/gen-cli-reference.py --check --bin target/debug/treeship
      - name: Documented flows execute with documented verdicts
        run: bash scripts/check-docs-snippets.sh target/debug/treeship

      - name: Build CLI with OTel
        run: cargo build -p treeship-cli --features otel

      # Smoke acceptance: end-to-end session round-trip exercises the full
      # capture-normalize-verify chain. Catches release-breaking regressions
      # the per-package unit tests can't see. T1-T9 stubs in the suite
      # document the broader v0.9.6 trust-fabric invariants pending port.
      - name: Trust-fabric acceptance suite
        run: bash tests/acceptance/trust-fabric.sh

      # Plugin hook parity: runs each plugin's PostToolUse/PreToolUse hooks
      # against fixtures with a mock treeship and diffs the recorded events.
      # Gates the AUD-26 secret-redaction fixtures (and the per-plugin event
      # mapping) so a change to a hook script that leaks or drops events fails
      # on push. Self-contained: mock binary, no cargo build needed.
      - name: Plugin hook parity suite
        run: sh integrations/tests/parity.sh

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2

      # Clippy ran on nobody's machine consistently and gated nothing, so the
      # workspace had accumulated 149 warnings -- including a live-lock
      # (`reader.lines().flatten()` spins forever on a persistent read error,
      # in the thread draining a wrapped child's pipe) and a doc comment whose
      # function had been deleted, leaving it attached to an unrelated one.
      #
      # Lint policy lives in `[workspace.lints.clippy]` in the root Cargo.toml:
      # anything allowed is allowed there, in writing, with a reason. That
      # keeps this step at `-D warnings` rather than at a tolerated count,
      # which is the only version of this gate that stays at zero.
      #
      # Scoped to the crates CI builds. treeship-zk-risc0's guest needs the
      # RISC0 toolchain (riscv32im-risc0-zkvm-elf), which is not installed here.
      - name: Clippy
        run: cargo clippy -p treeship-core -p treeship-cli -p treeship-core-wasm --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  js-suites:
    name: JS tests (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - packages/sdk-ts
          - packages/verify-js
          - bridges/mcp
          - bridges/a2a
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # These four suites -- 42 tests total -- existed and ran on nobody's
      # machine. `cross-sdk` exercises the SDKs against a built CLI, which is a
      # different claim: it does not run their unit tests, so a regression
      # inside the TypeScript SDK or either bridge could not fail a build.
      - name: Install
        working-directory: ${{ matrix.pkg }}
        run: npm ci

      - name: Test
        working-directory: ${{ matrix.pkg }}
        run: npm test

  python-sdk:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # 44 tests, stdlib unittest only -- no pytest, no install step. They
      # stub subprocess.run, so no treeship binary is needed either.
      #
      # `tests/` had no `__init__.py`, so the invocation the test files
      # themselves document ("python -m unittest discover -s .../tests") failed
      # with "Start directory is not importable" and only 28 of the 44 were
      # reachable at all. Added, so discovery finds every test and this job
      # runs what the docstring promises.
      - name: Test
        working-directory: packages/sdk-python
        run: python -m unittest discover -s tests -t .
        env:
          PYTHONPATH: .

  docs-build:
    name: Docs production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # `docs-route-health` and `docs-drift` check content; neither compiles
      # the site. An MDX error or a broken import therefore reached Vercel
      # before anything caught it. This is the build that actually fails.
      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Build Hub
        working-directory: packages/hub
        run: go build ./...

      # Run the hub's Go tests too. The object-authz regression tests from the
      # 2026-07 audit (DockOwnsCheckpointSigner, per-dock ownership) live here
      # and previously did not gate merges — CI only built the hub.
      - name: Test Hub
        working-directory: packages/hub
        run: go test ./...

  cross-sdk:
    name: Cross-SDK contract (${{ matrix.os }} / Node ${{ matrix.node }} / Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build CLI
        run: cargo build --bin treeship

      # Cross-SDK builds @treeship/core-wasm from source (so it tests the
      # workspace, not whatever was last published to npm). wasm-pack is
      # required.
      - name: Install wasm-pack
        # Pinned crates.io install with a locked dependency graph,
        # replacing the previous `curl … | sh` which executed whatever
        # the rustwasm.github.io CDN served at job runtime.
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install tsx
        run: |
          npm install --no-save tsx
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run cross-SDK contract suite
        run: ./tests/cross-sdk/run.sh
