name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # PR-level guard against the failure mode that produced the v0.9.6 PyPI
  # drift: pyproject.toml at 0.9.5 while every other package was at 0.9.6,
  # and stale @treeship/core-wasm pins in three packages. Anchors on
  # packages/core/Cargo.toml and fails if any other site disagrees.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check internal version consistency
        run: python3 scripts/check-release-versions.py --consistency
      - name: Check release platform topology
        run: python3 scripts/check-release-platforms.py

  # The tag-only release workflow cannot validate a new target on a PR. Build
  # and execute the exact static Linux arm64 target here so a broken linker,
  # target, or runner label blocks merge instead of failing on release day.
  release-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)
        with:
          toolchain: '1.94.1'
          targets: aarch64-unknown-linux-musl
      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build static Linux arm64 CLI
        run: cargo build --release --target aarch64-unknown-linux-musl -p treeship-cli
      - name: Verify and smoke the release binary
        run: |
          set -e
          BIN=target/aarch64-unknown-linux-musl/release/treeship
          file "$BIN"
          if file "$BIN" | grep -qE 'dynamically linked|interpreter'; then
            echo "::error::treeship-linux-aarch64 is not statically linked"
            exit 1
          fi
          "$BIN" --version
          TMPHOME=$(mktemp -d)
          "$BIN" --config "$TMPHOME/config.json" init >/dev/null
          OUT=$("$BIN" --config "$TMPHOME/config.json" attest action \
            --actor agent://ci-arm64 --action smoke.sign --format json)
          ID=$(printf '%s' "$OUT" | sed -n 's/.*"id":"\([a-z0-9_]\+\)".*/\1/p')
          test -n "$ID"
          "$BIN" --config "$TMPHOME/config.json" verify "$ID" >/dev/null

  # Static check that every page advertised in a docs `meta.json`
  # resolves to a real `.mdx` file (or a sub-section), every section
  # root has either an index.mdx or a redirect in `next.config.mjs`,
  # and every redirect points at a destination that exists. Catches
  # the failure mode where a renamed/deleted doc leaves a sidebar
  # entry pointing at a 404, or where a new section ships without a
  # root redirect so `/cli` works but `/concepts` doesn't. Cheap; no
  # network, no build.
  docs-route-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check docs route health
        run: python3 scripts/check-docs-routes.py

  # Docs-to-code drift gates (the 2026-07 audit failure modes). All static,
  # no build: the OpenAPI spec must match the hub router's route table, docs
  # may only reference SDK methods/exports that exist in the TypeScript
  # sources, every entry in feature-inventory.yml must point at real code,
  # and every spec file must be indexed with an honest status.
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pyyaml (feature-inventory linter)
        run: pip install pyyaml
      # DESIGN.md's verdict table says "no synonyms". Nothing enforced it, and
      # the 2026-08 dogfood found three vocabularies in one product -- the spec
      # listing words nothing printed, the CLI printing words it did not name,
      # and the website verifier inventing four more, after the table existed.
      # A written-down rule with no check is what produced that.
      - name: Verdict vocabulary has no synonyms
        run: python3 scripts/check-verdict-vocabulary.py

      - name: Hub OpenAPI matches the router
        run: python3 scripts/check-hub-openapi.py
      - name: Docs reference only real SDK methods
        run: python3 scripts/check-sdk-docs.py
      - name: Feature inventory entries point at real code
        run: python3 scripts/check-feature-inventory.py --strict

      # The mechanical half of the capability index. feature-inventory.yml is
      # curated (what we ship and how stable); this is derived (what is
      # actually reachable, to the byte). A new route or wire type fails here
      # until the map is regenerated, so the surface cannot grow in silence.
      - name: Capability map matches source
        run: |
          cargo build --bin treeship --quiet
          python3 scripts/gen-capability-map.py --check
      # PR #308 committed nine conflict markers into a published doc. Every
      # other gate passed -- none of them read that file. This one is a grep
      # that runs, which is the whole point: the markers were not hard to see,
      # nothing looked.
      - name: No committed conflict markers
        run: python3 scripts/check-conflict-markers.py
      # v0.24.0 published a bundler-only wasm build that would not load in
      # Node at all. Nobody caught it because the only consumer exercised was
      # the website, which vendors and bundles the wasm. This installs the
      # tarball and imports it the way a user does.
      # #320 fixed core-wasm and tested core-wasm. The package users install is
      # @treeship/verify, which pins core-wasm EXACTLY -- so a green core-wasm
      # gate can sit beside a broken user install indefinitely. This exercises
      # the package a user actually gets.
      - name: "@treeship/verify installs and verifies under Node"
        run: |
          cargo install wasm-pack --version 0.14.0 --locked || true
          bash packages/core-wasm/build-npm.sh "$(node -p "require('./packages/verify-js/package.json').dependencies['@treeship/core-wasm']")"
          bash scripts/check-verify-js-loads.sh
      - name: core-wasm installs and verifies under Node
        run: |
          cargo install wasm-pack --version 0.14.0 --locked || true
          bash packages/core-wasm/build-npm.sh "$(node -p "require('./packages/core-wasm/pkg/package.json').version" 2>/dev/null || echo 0.0.0-ci)"
          bash scripts/check-wasm-loads.sh packages/core-wasm/pkg
      # Three separate cases: a Homebrew formula that does not exist, a Kimi
      # skill shipping `cargo install treeship-cli`, and that command being
      # described as "orphaned at v0.4.0" when it actually fails outright.
      # Offline by default -- a registry outage must not fail CI.
      - name: Documented install routes exist
        run: python3 scripts/check-install-routes.py
      - name: Every protocol spec is indexed
        run: python3 scripts/check-specs-index.py
      # `schemas/` is the publishable copy; the predicate registry has its own.
      # Both carry the same $id, so a resolver can get either -- and this repo
      # has already produced three verdict vocabularies and two redactors from
      # exactly this shape. Each pair agreed on the day it was duplicated.
      - name: Publishable schemas agree with the predicate registry
        run: python3 scripts/check-schema-single-source.py
      # The schema package ships its own fixtures, including a negative case
      # asserting a smuggled self-report is rejected. Nothing ran them.
      - name: Schema fixtures behave as documented
        run: |
          cd schemas
          npm ci --no-audit --no-fund
          node validate.mjs
      - name: Published crates embed only files inside their own root
        run: python3 scripts/check-vendored-fonts.py
      - name: Paper-receipt template matches the copy vendored downstream
        run: python3 scripts/check-downstream-template.py
      - name: Generated feature matrix matches the inventory
        # The generator needs only the `yaml` package (package-lock.json is
        # gitignored in docs/, so no npm ci; skip the full fumadocs install).
        run: |
          cd docs
          npm install --no-save --ignore-scripts --no-audit --no-fund yaml@^2.9.0
          node scripts/sync-feature-matrix.mjs --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)

      # Run the full shipped-binary test surface, not just core. Before this,
      # CI ran only `cargo test -p treeship-core`, so every regression test in
      # treeship-cli (capability / verify / hub / wrap / resolve / profile) and
      # treeship-core-wasm (the browser verifier) passed on a contributor's
      # machine but never gated a merge. That is the gap the 2026-07 audits
      # flagged: a fix's fail-before-fix test must actually run on push.
      # (treeship-zk-risc0 needs the RISC0 guest toolchain and is added
      # separately; the `zk` feature is pre-release.)
      - name: Run tests
        run: cargo test -p treeship-core -p treeship-cli -p treeship-core-wasm -p rig-treeship

      - name: The published crate tarball actually compiles
        # `cargo publish` builds from a tarball containing only files under the
        # crate root, so an include reaching outside it compiles here and fails
        # there. That is how treeship-core missed crates.io in v0.22.0 while
        # npm and PyPI shipped -- a partial release the version preflight could
        # not catch, because every version was correct. This runs the same
        # verify step publish does.
        run: cargo package -p treeship-core --allow-dirty

      - name: Build CLI
        run: cargo build -p treeship-cli

      # The two gates that need the binary. The command matrix docs page is
      # generated from the CLI's own help output — a surface change without a
      # regen fails here. The snippets script executes the flows the README
      # and docs teach (wrap/verify, scoped approvals, onboard → key-bound,
      # selective disclosure, structural-pass semantics) and asserts the
      # documented verdicts, offline, in a throwaway store.
      - name: Generated CLI command matrix matches the binary
        run: python3 scripts/gen-cli-reference.py --check --bin target/debug/treeship
      - name: Documented flows execute with documented verdicts
        run: bash scripts/check-docs-snippets.sh target/debug/treeship

      - name: Build CLI with OTel
        run: cargo build -p treeship-cli --features otel

      # Smoke acceptance: end-to-end session round-trip exercises the full
      # capture-normalize-verify chain. Catches release-breaking regressions
      # the per-package unit tests can't see. T1-T9 stubs in the suite
      # document the broader v0.9.6 trust-fabric invariants pending port.
      - name: Trust-fabric acceptance suite
        run: bash tests/acceptance/trust-fabric.sh

      # Plugin hook parity: runs each plugin's PostToolUse/PreToolUse hooks
      # against fixtures with a mock treeship and diffs the recorded events.
      # Gates the AUD-26 secret-redaction fixtures (and the per-plugin event
      # mapping) so a change to a hook script that leaks or drops events fails
      # on push. Self-contained: mock binary, no cargo build needed.
      - name: Plugin hook parity suite
        run: sh integrations/tests/parity.sh

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2

      # Clippy ran on nobody's machine consistently and gated nothing, so the
      # workspace had accumulated 149 warnings -- including a live-lock
      # (`reader.lines().flatten()` spins forever on a persistent read error,
      # in the thread draining a wrapped child's pipe) and a doc comment whose
      # function had been deleted, leaving it attached to an unrelated one.
      #
      # Lint policy lives in `[workspace.lints.clippy]` in the root Cargo.toml:
      # anything allowed is allowed there, in writing, with a reason. That
      # keeps this step at `-D warnings` rather than at a tolerated count,
      # which is the only version of this gate that stays at zero.
      #
      # Scoped to the crates CI builds. treeship-zk-risc0's guest needs the
      # RISC0 toolchain (riscv32im-risc0-zkvm-elf), which is not installed here.
      - name: Clippy
        run: cargo clippy -p treeship-core -p treeship-cli -p treeship-core-wasm -p rig-treeship --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  js-suites:
    name: JS tests (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - packages/verify-js
          - bridges/mcp
          - bridges/a2a
          # Runs the shared redaction vectors (tests/vectors/redaction.json)
          # against the plugin's TypeScript redactor. The Rust CLI runs the
          # same file. Without both in CI the two copies drift silently --
          # receipts keep being produced, they just stop being safe.
          - integrations/openclaw-plugin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # These suites existed and ran on nobody's machine. `cross-sdk` looks
      # like it covers them but does not: it exercises the SDKs against a built
      # CLI, which is a different claim than running their unit tests, so a
      # regression inside either bridge could not fail a build.
      #
      # Pure JS, no Rust -- `sdk-ts` needs the CLI and gets its own job.
      # A release PR bumps @treeship/core-wasm to the version being released,
      # which by definition is not on npm yet -- `npm ci` fails with
      # `ETARGET notarget No matching version found`. That is the release
      # doing its job, not a regression in the package under test.
      #
      # These jobs did not exist at the v0.24.0 release (17 checks, zero JS
      # tests), which is why this never surfaced before.
      #
      # Both halves happen in ONE step on purpose. Providing the local build
      # in a separate step did not work: `npm ci` deletes node_modules before
      # installing, so it erased the local package that had just been placed
      # there. When the pin is unpublished the job must skip `npm ci`
      # entirely and resolve the pin from this tree instead.
      - name: Install
        run: |
          set -euo pipefail
          PKG="${{ matrix.pkg }}"
          PIN="$(node -p "
            const p=require('./$PKG/package.json');
            ((p.dependencies||{})['@treeship/core-wasm'])
              || ((p.peerDependencies||{})['@treeship/core-wasm']) || ''
          ")"

          if [ -z "$PIN" ] || npm view "@treeship/core-wasm@$PIN" version >/dev/null 2>&1; then
            echo "core-wasm pin ${PIN:-<none>} is resolvable from the registry; normal install"
            cd "$PKG"
            npm ci
            exit 0
          fi

          echo "@treeship/core-wasm@$PIN is not published; building it from this tree"
          cargo install wasm-pack --version 0.14.0 --locked || true
          bash packages/core-wasm/build-npm.sh "$PIN"
          cd "$PKG"
          # One install, not two. `npm install <path>` brings the whole
          # dependency tree with it (55 packages for verify-js), so a
          # following bare `npm install` adds nothing -- and fails, because
          # it re-reconciles package.json against a registry that does not
          # have the pinned version. That second call was the actual error.
          #
          # `npm install`, not `ci`: the lockfile names a version the registry
          # does not have, and `ci` refuses to deviate from a lockfile it
          # cannot satisfy.
          npm install "$GITHUB_WORKSPACE/packages/core-wasm/pkg" --no-save --no-audit --no-fund

      - name: Test
        working-directory: ${{ matrix.pkg }}
        run: npm test

  sdk-ts:
    name: JS tests (packages/sdk-ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Audit item 32. `roundtrip.test.ts` drives the real CLI and builds it
      # on demand when it is missing -- so on a cold runner the release build
      # happens *inside* vitest, blocking a worker for ~82s. Every test still
      # passed, and the run failed anyway: vitest's worker RPC gave up with
      # `Timeout calling "onTaskUpdate"`.
      #
      # Building here first means the test finds the binary already present
      # and just runs. The build is the same work either way; the difference
      # is that a build step that takes 82 seconds is normal, and a test that
      # blocks its reporter for 82 seconds is a flake.
      - name: Build CLI for the roundtrip suite
        run: cargo build --release -p treeship-cli

      # Same unpublished-pin problem as the matrix job above: a release bumps
      # the core-wasm pin to the version being released, which is not on npm
      # yet. This job has its own Install because it also needs the CLI, so
      # the fix has to be repeated rather than shared.
      - name: Install
        run: |
          set -euo pipefail
          PIN="$(node -p "
            const p=require('./packages/sdk-ts/package.json');
            ((p.dependencies||{})['@treeship/core-wasm'])
              || ((p.peerDependencies||{})['@treeship/core-wasm']) || ''
          ")"

          if [ -z "$PIN" ] || npm view "@treeship/core-wasm@$PIN" version >/dev/null 2>&1; then
            echo "core-wasm pin ${PIN:-<none>} is resolvable from the registry; normal install"
            cd packages/sdk-ts
            npm ci
            exit 0
          fi

          echo "@treeship/core-wasm@$PIN is not published; building it from this tree"
          cargo install wasm-pack --version 0.14.0 --locked || true
          bash packages/core-wasm/build-npm.sh "$PIN"
          cd packages/sdk-ts
          npm install "$GITHUB_WORKSPACE/packages/core-wasm/pkg" --no-save --no-audit --no-fund

      - name: Test
        working-directory: packages/sdk-ts
        run: npm test

  python-sdk:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # 44 tests, stdlib unittest only -- no pytest, no install step. They
      # stub subprocess.run, so no treeship binary is needed either.
      #
      # `tests/` had no `__init__.py`, so the invocation the test files
      # themselves document ("python -m unittest discover -s .../tests") failed
      # with "Start directory is not importable" and only 28 of the 44 were
      # reachable at all. Added, so discovery finds every test and this job
      # runs what the docstring promises.
      - name: Test
        working-directory: packages/sdk-python
        run: python -m unittest discover -s tests -t .
        env:
          PYTHONPATH: .

  docs-build:
    name: Docs production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # `docs-route-health` and `docs-drift` check content; neither compiles
      # the site. An MDX error or a broken import therefore reached Vercel
      # before anything caught it. This is the build that actually fails.
      # `npm install`, not `npm ci`: docs/.gitignore excludes package-lock.json
      # deliberately, so there is no lockfile to install from. That makes this
      # job non-hermetic -- it resolves against the registry each run and can
      # break on an upstream release rather than on our change. Worth it to
      # have the build gated at all; commit the lockfile to make it hermetic.
      - name: Install
        working-directory: docs
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: docs
        run: npm run build

  deps-rust:
    name: Dependency audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      # Advisories are ignored in .cargo/audit.toml, never inline here, so
      # every exception carries a written reason and a condition for removing
      # it. An ignore list buried in a CI command is how a scanner goes quiet
      # without anyone deciding that it should.
      #
      # The rule for adding one: if `cargo tree -p treeship-cli -i <crate>`
      # resolves, it reaches the shipped binary and is not a candidate.
      - name: cargo audit
        run: cargo audit

  deps-go:
    name: Dependency audit (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # govulncheck reports only vulnerabilities whose affected symbols are
      # actually reachable from this code, so a finding here is a real call
      # path rather than a version-range match. That makes it worth failing
      # on, and it is why the Go toolchain pin above matters -- most of what
      # it finds is in the standard library the build ships with.
      - name: govulncheck
        working-directory: packages/hub
        run: govulncheck ./...

  deps-js:
    name: Dependency audit (JS, ${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - packages/sdk-ts
          - packages/verify-js
          - bridges/mcp
          - bridges/a2a
          - integrations/openclaw-plugin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # --omit=dev: a vulnerability in a test runner is not a vulnerability in
      # anything users install. Auditing dev dependencies at the same severity
      # is how these gates get switched off.
      #
      # docs/ is deliberately absent: docs/.gitignore excludes its lockfile,
      # so there is nothing reproducible to audit. That gap is tracked as
      # audit item 14, and committing the lockfile is what closes it.
      - name: npm audit
        working-directory: ${{ matrix.pkg }}
        run: npm audit --omit=dev --audit-level=high

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # go.mod declares `go 1.22` as the minimum language version; this is
          # the toolchain that actually builds the binary, and it must be a
          # supported release. 1.22 stopped receiving security fixes, so the
          # hub was being built by a compiler that would never be patched --
          # This pin goes stale on Go's release cadence, and the deps-go job
          # is what notices: 1.26.5 was clean when pinned and failed a day
          # later, when 1.26.6 shipped fixing five stdlib advisories --
          # including a net/http one that `rekor.Anchor` actually calls.
          # Bump this when that job goes red; that is the job working.
          go-version: '1.26.6'

      - name: Build Hub
        working-directory: packages/hub
        run: go build ./...

      # Run the hub's Go tests too. The object-authz regression tests from the
      # 2026-07 audit (DockOwnsCheckpointSigner, per-dock ownership) live here
      # and previously did not gate merges — CI only built the hub.
      - name: Test Hub
        working-directory: packages/hub
        run: go test ./...

  cross-sdk:
    name: Cross-SDK contract (${{ matrix.os }} / Node ${{ matrix.node }} / Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving branch; pinned to current tip)
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build CLI
        run: cargo build --bin treeship

      # Cross-SDK builds @treeship/core-wasm from source (so it tests the
      # workspace, not whatever was last published to npm). wasm-pack is
      # required.
      - name: Install wasm-pack
        # Pinned crates.io install with a locked dependency graph,
        # replacing the previous `curl … | sh` which executed whatever
        # the rustwasm.github.io CDN served at job runtime.
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install tsx
        run: |
          npm install --no-save tsx
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run cross-SDK contract suite
        run: ./tests/cross-sdk/run.sh
